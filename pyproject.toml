[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "bqrc-digital-engineering-platform"
version = "0.1.0"
description = "Digital engineering, simulation, analysis, and hardware-transition platform for BQRC-01."
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "BQRC Project Team" }
]

dependencies = [
    "numpy>=2.1,<3.0",
    "scipy>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
]


[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

research = [
    "pandas>=2.2,<3.0",
    "matplotlib>=3.9,<4.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true